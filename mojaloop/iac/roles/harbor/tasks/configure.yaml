---
# ---------------------------
# Wait for Harbor
# ---------------------------
- name: Wait for Harbor to respond
  uri:
    url: "http://{{ harbor_url }}/api/v2.0/users/current"
    method: GET
    user: "{{ admin_user }}"
    password: "{{ admin_password }}"
    force_basic_auth: yes
    status_code: 200
  register: harbor_status
  until: harbor_status.status == 200
  retries: 30
  delay: 10

# ---------------------------
# Registry Management
# ---------------------------

- name: Get existing registries
  uri:
    url: "http://{{ harbor_url }}/api/v2.0/registries"
    method: GET
    user: "{{ admin_user }}"
    password: "{{ admin_password }}"
    force_basic_auth: yes
    status_code: 200
  register: existing_registries_refreshed

- name: Ensure proxy registries exist
  uri:
    url: "http://{{ harbor_url }}/api/v2.0/registries"
    method: POST
    user: "{{ admin_user }}"
    password: "{{ admin_password }}"
    force_basic_auth: yes
    headers:
      Content-Type: application/json
    body_format: json
    body: |
      {
        "name": "{{ item.name }}",
        "type": "{{ item.type | default('docker-hub') }}",
        "url": "{{ item.endpoint }}",
        "credential": { "type": "anonymous" }
      }
    status_code: 201
  loop: "{{ proxy_projects }}"
  when: >
    existing_registries_refreshed.json
    | selectattr('url', 'equalto', item.endpoint)
    | list
    | length == 0

- name: Refresh registry list after create
  uri:
    url: "http://{{ harbor_url }}/api/v2.0/registries"
    method: GET
    user: "{{ admin_user }}"
    password: "{{ admin_password }}"
    force_basic_auth: yes
    status_code: 200
  register: existing_registries_refreshed

- name: Map project name to registry_id
  set_fact:
    registry_id_map: "{{ registry_id_map | default({}) | combine({ item.name: registry_id }) }}"
  vars:
    registry_id: >-
      {{
        (existing_registries_refreshed.json
         | selectattr('url', 'equalto', item.endpoint)
         | map(attribute='id')
         | list
         | first)
      }}
  loop: "{{ proxy_projects }}"



# ---------------------------
# Proxy Project Management
# ---------------------------
- name: Check if proxy projects exist
  uri:
    url: "http://{{ harbor_url }}/api/v2.0/projects/{{ item.name }}"
    method: GET
    user: "{{ admin_user }}"
    password: "{{ admin_password }}"
    force_basic_auth: yes
    status_code: [200, 404]
  register: proxy_projects_status
  loop: "{{ proxy_projects }}"

- name: Create proxy projects if not exist
  uri:
    url: "http://{{ harbor_url }}/api/v2.0/projects"
    method: POST
    user: "{{ admin_user }}"
    password: "{{ admin_password }}"
    force_basic_auth: yes
    headers:
      Content-Type: application/json
    body: "{{ lookup('template', 'create_proxy_project.json.j2') }}"
    body_format: json
    status_code: 201
  loop: "{{ proxy_projects_status.results }}"
  when: item.status == 404

# ---------------------------
# Read-only User Management
# ---------------------------
- name: Check if readonly user exists
  uri:
    url: "http://{{ harbor_url }}/api/v2.0/users?username={{ readonly_user.username }}"
    method: GET
    user: "{{ admin_user }}"
    password: "{{ admin_password }}"
    force_basic_auth: yes
    status_code: 200
  register: readonly_user_status

- name: Create readonly user if not exists
  uri:
    url: "http://{{ harbor_url }}/api/v2.0/users"
    method: POST
    user: "{{ admin_user }}"
    password: "{{ admin_password }}"
    force_basic_auth: yes
    headers:
      Content-Type: application/json
    body: "{{ lookup('template', 'create_readonly_user.json.j2') }}"
    body_format: json
    status_code: 201
  when: readonly_user_status.json | length == 0

- name: Refresh readonly user info
  uri:
    url: "http://{{ harbor_url }}/api/v2.0/users?username={{ readonly_user.username }}"
    method: GET
    user: "{{ admin_user }}"
    password: "{{ admin_password }}"
    force_basic_auth: yes
    status_code: 200
  register: readonly_user_status_refreshed

- name: Set readonly user ID fact
  set_fact:
    readonly_user_id: "{{ readonly_user_status_refreshed.json[0].user_id }}"

# ---------------------------
# Project Membership Management
# ---------------------------
- name: Check readonly user membership for each project
  uri:
    url: "http://{{ harbor_url }}/api/v2.0/projects/{{ item.name }}/members"
    method: GET
    user: "{{ admin_user }}"
    password: "{{ admin_password }}"
    force_basic_auth: yes
    status_code: 200
  register: project_memberships
  loop: "{{ proxy_projects }}"

- name: Add readonly user to project with Guest role if missing
  uri:
    url: "http://{{ harbor_url }}/api/v2.0/projects/{{ item.item.name }}/members"
    method: POST
    user: "{{ admin_user }}"
    password: "{{ admin_password }}"
    force_basic_auth: yes
    body_format: json
    body:
      role_id: 3
      member_user:
        username: "{{ readonly_user.username }}"
    status_code: [201, 409]
  loop: "{{ project_memberships.results | default([]) }}"
  when: >
    (
      item.json | default([])
      | selectattr('entity_name', 'equalto', readonly_user.username)
      | selectattr('role_id', 'equalto', 3)
      | list
      | length == 0
    )

# ---------------------------
# Create helm-oci-proxy project
# ---------------------------
- name: Check if helm-oci-proxy project exists
  uri:
    url: "http://{{ harbor_url }}/api/v2.0/projects/helm-oci-proxy"
    method: GET
    user: "{{ admin_user }}"
    password: "{{ admin_password }}"
    force_basic_auth: yes
    status_code: [200, 404]
  register: helm_oci_proxy_project_status

- name: Create helm-oci-proxy project if missing
  uri:
    url: "http://{{ harbor_url }}/api/v2.0/projects"
    method: POST
    user: "{{ admin_user }}"
    password: "{{ admin_password }}"
    force_basic_auth: yes
    headers:
      Content-Type: application/json
    body:
      project_name: "helm-oci-proxy"
      metadata:
        public: "false"
    body_format: json
    status_code: 201
  when: helm_oci_proxy_project_status.status == 404

# ---------------------------
# Configure upstream OCI proxy registries
# ---------------------------
- name: Ensure upstream OCI proxy registries exist
  uri:
    url: "http://{{ harbor_url }}/api/v2.0/registries"
    method: POST
    user: "{{ admin_user }}"
    password: "{{ admin_password }}"
    force_basic_auth: yes
    headers:
      Content-Type: application/json
    body_format: json
    body: |
      {
        "name": "{{ item.name }}",
        "type": "oci",
        "url": "{{ item.url }}",
        "credential": { "type": "{{ item.credential_type | default('anonymous') }}" }
      }
    status_code: 201
  loop: "{{ upstream_oci_registries }}"
  when: >
    (existing_registries_refreshed.json
     | selectattr('url', 'equalto', item.url)
     | list
     | length == 0)

# ---------------------------
# Pull and push converted classic charts
# ---------------------------
- name: Collect all versions for converted classic charts
  set_fact:
    charts_to_push: >-
      {{
        charts_to_push | default([]) + [
          {
            'name': item.name,
            'version': version.version,
            'repo_name': item.name,
            'harbor_project': 'helm-oci-proxy'
          }
          for version in (chart_index_yaml.results[loop.index0].content | from_yaml).entries[item.name]
        ]
      }}
  loop: "{{ converted_classic_charts }}"
  
- name: Ensure Helm 3 is installed
  ansible.builtin.command: helm version --short
  register: helm_check
  ignore_errors: yes

- name: Download and install Helm if missing
  ansible.builtin.get_url:
    url: https://get.helm.sh/helm-v3.12.3-linux-amd64.tar.gz
    dest: /tmp/helm.tar.gz
  when: helm_check.failed

- name: Extract and install Helm binary
  ansible.builtin.unarchive:
    src: /tmp/helm.tar.gz
    dest: /usr/local/bin/
    remote_src: yes
    copy: no
    extra_opts: [--strip-components=1]
  when: helm_check.failed

- name: Login to Harbor OCI registry
  command: >
    helm registry login {{ harbor_url }}
    --username {{ admin_user }}
    --password {{ admin_password }}
  changed_when: false

- name: Pull and push converted classic charts to helm-oci-proxy (idempotent)
  block:
    - name: Check if chart version already exists in Harbor
      command: >
        helm pull oci://{{ harbor_url }}/helm-oci-proxy/{{ item.name }} --version {{ item.version }}
      register: chart_exists
      ignore_errors: true
      changed_when: false

    - name: Pull chart version from upstream if not exists
      command: >
        helm pull {{ item.repo_name }}/{{ item.name }}
        --version {{ item.version }}
        --destination /tmp
      args:
        creates: "/tmp/{{ item.name }}-{{ item.version }}.tgz"
      when: chart_exists.rc != 0

    - name: Push chart to helm-oci-proxy if not exists
      command: >
        helm push /tmp/{{ item.name }}-{{ item.version }}.tgz
        oci://{{ harbor_url }}/helm-oci-proxy
      when: chart_exists.rc != 0

    - name: Cleanup local chart tarball
      file:
        path: "/tmp/{{ item.name }}-{{ item.version }}.tgz"
        state: absent
  loop: "{{ charts_to_push }}"