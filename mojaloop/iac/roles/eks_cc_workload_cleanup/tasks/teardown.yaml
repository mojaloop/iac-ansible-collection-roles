- name: Delete all appsets in argocd namespace
  ansible.builtin.shell: |
    export KUBECONFIG={{ kubeconfig_location }}/kubeconfig
    kubectl delete appset -n argocd --all --wait=false
  args:
    executable: /bin/bash
  ignore_errors: true

- name: Disable argocd apps automated sync
  ansible.builtin.shell: |
    export KUBECONFIG={{ kubeconfig_location }}/kubeconfig
    kubectl patch application -n argocd root-app --type json --patch='[ { "op": "remove", "path": "/spec/syncPolicy/automated" } ]' || true
    for app in monitoring \
      zitadel-pre \
      netbird-pre \
      gitlab-pre; do
      kubectl patch application -n argocd $app --type json --patch='[ { "op": "remove", "path": "/spec/syncPolicy/automated" } ]' || true
    done
  args:
    executable: /bin/bash
  ignore_errors: true

- name: Get all RDSClusters in zitadel namespace
  ansible.builtin.shell: |
    export KUBECONFIG={{ kubeconfig_location }}/kubeconfig
    kubectl get RDSCluster -n zitadel -o jsonpath='{.items[*].metadata.name}'
  args:
    executable: /bin/bash
  register: rds_clusters
  changed_when: false

- name: Delete each RDSCluster one by one in zitadel namespace
  ansible.builtin.shell: |
    export KUBECONFIG={{ kubeconfig_location }}/kubeconfig
    kubectl delete RDSCluster {{ item }} -n zitadel --wait=false
  args:
    executable: /bin/bash
  loop: "{{ rds_clusters.stdout.split() }}"
  ignore_errors: true

