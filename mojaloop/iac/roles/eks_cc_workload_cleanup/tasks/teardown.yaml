- name: Wait for all RDSClusters to be deleted in zitadel namespace
  ansible.builtin.shell: |
    export KUBECONFIG={{ kubeconfig_location }}/kubeconfig
    kubectl get RDSCluster -n zitadel -o jsonpath='{.items}'
  args:
    executable: /bin/bash
  register: rds_check
  retries: 30
  delay: 60
  until: rds_check.stdout == "[]"
  failed_when: rds_check.rc != 0 and "NotFound" not in rds_check.stderr

