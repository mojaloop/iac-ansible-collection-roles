- name: Gather the package facts
  ansible.builtin.package_facts:
    manager: auto

- name: Configure multipathd to ignore longhorn volumes
  blockinfile:
    path: /etc/multipath.conf
    block: |
      blacklist {
        devnode "^sd[a-z0-9]+"
      }
  register: multipathconf
  when: "'multipath-tools' in ansible_facts.packages"

- name: Restart multipathd
  ansible.builtin.service:
    name: multipathd
    state: restarted
  when: "'multipath-tools' in ansible_facts.packages and multipathconf.changed"

- name: Ensure nbd.conf exists with nbds_max=2048
  copy:
    dest: /etc/modprobe.d/nbd.conf
    content: "options nbd nbds_max=2048\n"
    owner: root
    group: root
    mode: '0644'

- name: Attempt to unload nbd module (ignored if in use)
  shell: "modprobe -r nbd"
  register: unload_nbd
  ignore_errors: true

- name: Load nbd module with nbds_max=2048
  shell: "modprobe nbd nbds_max=2048"
  register: load_nbd
  ignore_errors: true

- name: Check nbds_max value
  shell: "cat /sys/module/nbd/parameters/nbds_max 2>/dev/null || echo 'module_not_loaded'"
  register: nbds_value

- name: Print nbds_max result
  debug:
    msg: "nbds_max is: {{ nbds_value.stdout }}"