- name: Wait nexus to respond
  uri:
    url: http://{{ nexus_server }}/service/rest/v1/status
    method: GET
  register: _result
  until: _result.status == 200
  retries: 30
  delay: 10

# Classic Helm repository proxies
- name: Get classic helm proxy repo if exists
  uri:
    url: http://{{ nexus_server }}/service/rest/v1/repositories/helm/proxy/{{ item.name }}
    method: GET
    user: "admin"
    password: "{{ admin_password }}"
    force_basic_auth: yes
    status_code: [200, 404]
    timeout: 300
  register: helm_classic_proxy_repos_exists
  with_items: "{{ helm_classic_proxy_repos }}"

- name: Add classic helm proxy if not exists
  uri:
    url: http://{{ nexus_server }}/service/rest/v1/repositories/helm/proxy
    method: POST
    user: "admin"
    password: "{{ admin_password }}"
    force_basic_auth: yes
    headers:
      Content-Type: application/json
    body: "{{ lookup('template', 'createhelmclassicproxyrepo.json.j2') }}"
    body_format: json
    status_code: 201
    timeout: 300    
  when: item.status == 404
  with_items: "{{ helm_classic_proxy_repos_exists.results }}"

# OCI Helm repository proxies (using Docker format)
- name: Get OCI helm proxy repo if exists
  uri:
    url: http://{{ nexus_server }}/service/rest/v1/repositories/docker/proxy/{{ item.name }}
    method: GET
    user: "admin"
    password: "{{ admin_password }}"
    force_basic_auth: yes
    status_code: [200, 404]
    timeout: 300
  register: helm_oci_proxy_repos_exists
  with_items: "{{ helm_oci_proxy_repos }}"

- name: Add OCI helm proxy if not exists
  uri:
    url: http://{{ nexus_server }}/service/rest/v1/repositories/docker/proxy
    method: POST
    user: "admin"
    password: "{{ admin_password }}"
    force_basic_auth: yes
    headers:
      Content-Type: application/json
    body: "{{ lookup('template', 'createhelmociproxyrepo.json.j2') }}"
    body_format: json
    status_code: 201
    timeout: 300
  when: item.status == 404
  with_items: "{{ helm_oci_proxy_repos_exists.results }}"

# OCI Helm group repository
- name: Get OCI helm group repo if exists
  uri:
    url: http://{{ nexus_server }}/service/rest/v1/repositories/docker/group/{{ helm_oci_group_name }}
    method: GET
    user: "admin"
    password: "{{ admin_password }}"
    force_basic_auth: yes
    status_code: [200, 404]
    timeout: 300    
  register: helm_oci_group_repo_exists

- name: Update OCI helm group repo configuration
  uri:
    url: http://{{ nexus_server }}/service/rest/v1/repositories/docker/group/{{ helm_oci_group_name }}
    method: PUT
    user: "admin"
    password: "{{ admin_password }}"
    force_basic_auth: yes
    headers:
      Content-Type: application/json
    body: "{{ lookup('template', 'createhelmocigrouprepo.json.j2') }}"
    body_format: json
    status_code: [200, 204]
    timeout: 300
  when: helm_oci_group_repo_exists.status == 200  # Update existing repo

- name: Add OCI helm group repo if not exists
  uri:
    url: http://{{ nexus_server }}/service/rest/v1/repositories/docker/group
    method: POST
    user: "admin"
    password: "{{ admin_password }}"
    force_basic_auth: yes
    headers:
      Content-Type: application/json
    body: "{{ lookup('template', 'createhelmocigrouprepo.json.j2') }}"
    body_format: json
    status_code: 201
    timeout: 300    
  when: helm_oci_group_repo_exists.status == 404

# Security configuration - Enable anonymous access
- name: Enable anonymous access for repository access
  uri:
    url: http://{{ nexus_server }}/service/rest/v1/security/anonymous
    method: PUT
    user: "admin"
    password: "{{ admin_password }}"
    force_basic_auth: yes
    headers:
      Content-Type: application/json
    body_format: json
    body:
      enabled: true
      userId: "anonymous"
      realmName: "NexusAuthorizingRealm"
    status_code: 200
    timeout: 300
