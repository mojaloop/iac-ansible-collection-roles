- name: Wait nexus to respond
  uri:
    url: http://{{ nexus_server }}/service/rest/v1/status
    method: GET
  register: _result
  until: _result.status == 200
  retries: 30
  delay: 10

# Classic Helm repository proxies
- name: Get classic helm proxy repo if exists
  uri:
    url: http://{{ nexus_server }}/service/rest/v1/repositories/helm/proxy/{{ item.name }}
    method: GET
    user: "admin"
    password: "{{ admin_password }}"
    force_basic_auth: yes
    status_code: [200, 404]
    timeout: 300
  register: helm_classic_proxy_repos_exists
  with_items: "{{ helm_classic_proxy_repos }}"

- name: Add classic helm proxy if not exists
  uri:
    url: http://{{ nexus_server }}/service/rest/v1/repositories/helm/proxy
    method: POST
    user: "admin"
    password: "{{ admin_password }}"
    force_basic_auth: yes
    headers:
      Content-Type: application/json
    body: "{{ lookup('template', 'createhelmclassicproxyrepo.json.j2') }}"
    body_format: json
    status_code: 201
    timeout: 300    
  when: item.status == 404
  with_items: "{{ helm_classic_proxy_repos_exists.results }}"

