- name: Make sure snapd is installed
  ansible.builtin.package:
    name:
      - snapd
    state: latest
  become: true

- name: "create directory for microk8s config"
  become: true
  ansible.builtin.file:
    path: /var/snap/microk8s/common/
    state: directory
    recurse: no

- name: Create config file for mk8s
  become: true
  ansible.builtin.template:
    src: microk8s-config.yaml.j2
    dest: /var/snap/microk8s/common/.microk8s.yaml

- name: Create oidc config file for mk8s
  become: true
  ansible.builtin.copy:
    src: oidc.conf.yaml
    dest: /var/snap/microk8s/common/.oidc_config.yaml
    force: no
  when: kubernetes_oidc_enabled | bool

- name: Check microk8s installed
  become: true
  ansible.builtin.command: snap list microk8s
  register: microk8s_snap_list
  failed_when: false

- name: Set fact if microk8s is not installed
  set_fact:
    fact_microk8s_not_installed: "{{ microk8s_snap_list.rc != 0 or 'no matching snaps installed' in microk8s_snap_list.stderr or 'no matching snaps installed' in microk8s_snap_list.stdout }}"

- name: Extract microk8s channel from snap list
  set_fact:
    fact_microk8s_installed_channel_raw: "{{ microk8s_snap_list.stdout | regex_search('microk8s\\s+\\S+\\s+\\S+\\s+(\\S+)', '\\1') }}"

- name: Normalize microk8s channel to string
  set_fact:
    fact_microk8s_installed_channel: >-
      {{
        (fact_microk8s_installed_channel_raw is sequence and fact_microk8s_installed_channel_raw is not string)
        | ternary(fact_microk8s_installed_channel_raw | first | default(''), fact_microk8s_installed_channel_raw | default(''))
      }}

- name: Set fact if microk8s needs update
  set_fact:
    fact_microk8s_needs_update: "{{ (not fact_microk8s_not_installed) and (fact_microk8s_installed_channel != microk8s_version) }}"

- name: Set fact if microk8s refresh should run
  set_fact:
    fact_microk8s_refresh_requested: "{{ (not fact_microk8s_not_installed) and (fact_microk8s_needs_update or (microk8s_allow_patch_updates | bool)) }}"

- name: Debug microk8s snap info and facts
  debug:
    msg:
      - "microk8s_snap_list.stdout: {{ microk8s_snap_list.stdout }}"
      - "microk8s_snap_list.stderr: {{ microk8s_snap_list.stderr }}"
      - "fact_microk8s_installed_channel_raw: {{ fact_microk8s_installed_channel_raw }}"
      - "fact_microk8s_installed_channel: {{ fact_microk8s_installed_channel }}"
      - "fact_microk8s_not_installed: {{ fact_microk8s_not_installed }}"
      - "fact_microk8s_needs_update: {{ fact_microk8s_needs_update }}"
      - "fact_microk8s_refresh_requested: {{ fact_microk8s_refresh_requested }}"
      - "microk8s_allow_patch_updates: {{ microk8s_allow_patch_updates }}"

- name: Install microk8s
  become: true
  community.general.snap:
    name: microk8s
    classic: yes
    channel: "{{ microk8s_version }}"
  when: fact_microk8s_not_installed

- name: Update channel
  become: true
  ansible.builtin.command: snap refresh microk8s --channel={{ microk8s_version }}
  when: fact_microk8s_refresh_requested

- name: Hold microk8s snap refresh
  become: true
  ansible.builtin.command: snap refresh --hold
  changed_when: false

- name: add oidc config
  become: true
  ansible.builtin.blockinfile:
    dest: /var/snap/microk8s/current/args/kube-apiserver
    marker: "# {mark} ANSIBLE MANAGED: microk8s add oidc config"
    content: "--authentication-config /var/snap/microk8s/common/.oidc_config.yaml"
  when: kubernetes_oidc_enabled | bool

- name: add kubelet config
  become: true
  ansible.builtin.blockinfile:
    dest: /var/snap/microk8s/current/args/kubelet
    marker: "# {mark} ANSIBLE MANAGED: microk8s kubelet config"
    content: |
      --allowed-unsafe-sysctls=net.ipv4.ip_forward
      --max-pods={{ max_pods_per_node }}
      --cgroup-driver=systemd

- name: Create custom cilium addon directory
  become: true
  ansible.builtin.file:
    path: /var/snap/microk8s/common/addons/core/cilium
    state: directory
    mode: '0755'

- name: Create cilium addon enable script
  become: true
  ansible.builtin.template:
    src: cilium-enable.sh.j2
    dest: /var/snap/microk8s/common/addons/core/cilium/enable
    mode: '0755'

- name: Create cilium addon disable script
  become: true
  ansible.builtin.template:
    src: cilium-disable.sh.j2
    dest: /var/snap/microk8s/common/addons/core/cilium/disable
    mode: '0755'

- name: Add cilium addon to core addons list
  become: true
  ansible.builtin.blockinfile:
    path: /var/snap/microk8s/common/addons/core/addons.yaml
    marker: "# {mark} ANSIBLE MANAGED: cilium addon"
    insertafter: '^addons:'
    content: |
      - name: cilium
        description: "custom cilium install"
        version: "{{ cilium_version }}"
        check_status: "pod/cilium"
    create: true

- name: Wait for microk8s to be ready
  become: true
  ansible.builtin.command: microk8s.status --wait-ready
  changed_when: false
  register: mk8sstatusout
  failed_when:
    - "'This MicroK8s deployment is acting as a node in a cluster.' not in mk8sstatusout.stdout_lines"
    - mk8sstatusout.rc > 0

- name: Install Cilium addon
  become: true
  ansible.builtin.command: microk8s.enable cilium

- name: Create kubectl alias
  become: true
  ansible.builtin.command: "snap alias microk8s.kubectl kubectl"
  changed_when: false
  register: aliaskubectlout

- name: Create helm3 alias
  become: true
  ansible.builtin.command: "snap alias microk8s.helm3 helm"
  changed_when: false
  register: aliashelmout

- name: "create directory for mirror registry configs"
  become: true
  ansible.builtin.file:
    path: /var/snap/microk8s/current/args/certs.d/{{ item }}/
    state: directory
    recurse: no
  with_items: "{{ docker_registry_mirrors }}"
  when:
    - enable_registry_mirror

- name: Create mirror registry config
  become: true
  ansible.builtin.template:
    src: hosts.toml.j2
    dest: /var/snap/microk8s/current/args/certs.d/{{ item }}/hosts.toml
  with_items: "{{ docker_registry_mirrors }}"
  when:
    - enable_registry_mirror

- name: Build all registry auth blocks
  set_fact:
    registry_auth_blocks: |
      [plugins."io.containerd.grpc.v1.cri".registry.configs]
        [plugins."io.containerd.grpc.v1.cri".registry.configs."{{ registry_mirror_fqdn }}".auth]
          username = "{{ docker_registry_username }}"
          password = "{{ docker_registry_password }}"
  when: enable_registry_mirror

- name: Add all mirror registry credentials in one block
  ansible.builtin.blockinfile:
    dest: /var/snap/microk8s/current/args/containerd-template.toml
    marker: "# {mark} ANSIBLE MANAGED: microk8s Add mirror registry credentials"
    content: "{{ registry_auth_blocks }}"
  when: enable_registry_mirror

- name: Add SystemdCgroup to runc runtime options
  become: true
  ansible.builtin.replace:
    path: /var/snap/microk8s/current/args/containerd-template.toml
    regexp: '(\[plugins\."io\.containerd\.grpc\.v1\.cri"\.containerd\.runtimes\.runc\]\s*\n\s*# runtime_type.*\n\s*runtime_type = "\${RUNTIME_TYPE}")(?!\s*\n\s*\[plugins\."io\.containerd\.grpc\.v1\.cri"\.containerd\.runtimes\.runc\.options\])'
    replace: '\1\n      [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc.options]\n        SystemdCgroup = true'

- name: Create custom certificates
  become: true
  ansible.builtin.template:
    src: csr.conf.template.j2
    dest: /var/snap/microk8s/current/certs/csr.conf.template
    mode: 0644
  notify:
    - Wait for microk8s to be ready before handler
    - Refresh certs

- name: Create folder for microk8s certificates
  become: true
  ansible.builtin.file:
    path: /usr/share/ca-certificates/extra
    state: directory
    mode: 0755

- name: Copy certificates
  become: true
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /usr/share/ca-certificates/extra
    remote_src: yes
    force: yes
    mode: "0644"
  loop:
    - /var/snap/microk8s/current/certs/ca.crt
    - /var/snap/microk8s/current/certs/front-proxy-ca.crt

- name: Trust certificates generated by microk8s
  become: true
  ansible.builtin.command: "update-ca-certificates"
  register: command_result
  changed_when: "'0 added, 0 removed' not in command_result.stdout"

- name: Disable snap autoupdate
  become: true
  ansible.builtin.blockinfile:
    dest: /etc/hosts
    marker: "# {mark} ANSIBLE MANAGED: microk8s Disable snap autoupdate"
    content: |
      127.0.0.1 api.snapcraft.io
  when: microk8s_disable_snap_autoupdate

- name: Create systemd service to apply taint on startup
  become: true
  ansible.builtin.template:
    src: microk8s-taint.service.j2
    dest: /etc/systemd/system/microk8s-taint.service
    mode: '0644'
  when: microk8s_startup_taint_enabled

- name: Create systemd service scriptto cleanup RBD on startup
  become: true
  ansible.builtin.template:
    src: microk8s-rbd-preclean.sh.j2
    dest: /usr/local/bin/microk8s-rbd-preclean.sh
    mode: '0755'
  when: microk8s_startup_taint_enabled

- name: Create systemd service to cleanup RBD on startup
  become: true
  ansible.builtin.template:
    src: microk8s-rbd-preclean.service.j2
    dest: /etc/systemd/system/microk8s-rbd-preclean.service
    mode: '0644'
  when: microk8s_startup_taint_enabled

- name: Reload systemd daemon
  become: true
  ansible.builtin.systemd:
    daemon_reload: true
  when: microk8s_startup_taint_enabled

- name: Enable microk8s-taint service
  become: true
  ansible.builtin.systemd:
    name: microk8s-taint
    enabled: true
  when: microk8s_startup_taint_enabled

- name: Enable microk8s-cleanup-rbd service
  become: true
  ansible.builtin.systemd:
    name: microk8s-rbd-preclean
    enabled: true
  when: microk8s_startup_taint_enabled
