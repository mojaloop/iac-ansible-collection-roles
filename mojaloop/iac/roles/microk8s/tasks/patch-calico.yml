- name: Patch calico
  become: true
  ansible.builtin.shell: |
    microk8s kubectl patch FelixConfiguration/default --type merge -p '{"spec":{"xdpEnabled":false}}'
    microk8s kubectl patch FelixConfiguration/default --type='json' -p='[{"op": "add", "path": "/spec/workloadSourceSpoofing", "value": "Any"}]'
    microk8s kubectl patch daemonset calico-node -n kube-system --type='json' -p='[{"op": "add", "path": "/spec/template/spec/tolerations/-", "value": {"key": "netbird/ready", "operator": "Exists", "effect": "NoSchedule"}}]'
    microk8s kubectl patch deployment calico-kube-controllers -n kube-system --type='json' -p='[{"op": "add", "path": "/spec/template/spec/tolerations/-", "value": {"key": "netbird/ready", "operator": "Exists", "effect": "NoSchedule"}}]'