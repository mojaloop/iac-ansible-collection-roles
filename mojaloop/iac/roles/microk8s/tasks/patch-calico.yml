- name: Patch calico
  become: true
  ansible.builtin.shell: |
    # Felix tuning
    microk8s kubectl patch FelixConfiguration/default --type merge -p '{
      "spec": {
        "xdpEnabled": false,
        "workloadSourceSpoofing": "Any",
        "vethMTU": 1500,
        "iptablesBackend": "Auto",
        "iptablesRefreshInterval": "90s",
        "bpfConnectTimeLoadBalancingEnabled": false,
        "bpfHostNetworkedNATWithoutCTLB": true
      }
    }'

    # Disable overlay encapsulation
    microk8s kubectl patch ippool default-ipv4-ippool --type merge -p '{
      "spec": {
        "vxlanMode": "Never",
        "ipipMode": "Never"
      }
    }'

    # --- tolerations logic unchanged ---
    DAEMONSET_HAS_TOLERATION=$(microk8s kubectl get daemonset calico-node -n kube-system -o json | jq '.spec.template.spec.tolerations[]? | select(.operator=="Exists" and .effect=="NoSchedule" and (.key // "") == "")' | wc -l)
    DEPLOYMENT_HAS_TOLERATION=$(microk8s kubectl get deployment calico-kube-controllers -n kube-system -o json | jq '.spec.template.spec.tolerations[]? | select(.operator=="Exists" and .effect=="NoSchedule" and (.key // "") == "")' | wc -l)

    DAEMONSET_HAS_NOEXECUTE_TOLERATION=$(microk8s kubectl get daemonset calico-node -n kube-system -o json | jq '.spec.template.spec.tolerations[]? | select(.operator=="Exists" and .effect=="NoExecute" and (.key // "") == "")' | wc -l)
    DEPLOYMENT_HAS_NOEXECUTE_TOLERATION=$(microk8s kubectl get deployment calico-kube-controllers -n kube-system -o json | jq '.spec.template.spec.tolerations[]? | select(.operator=="Exists" and .effect=="NoExecute" and (.key // "") == "")' | wc -l)

    if [ "$DAEMONSET_HAS_TOLERATION" -eq 0 ]; then
      microk8s kubectl patch daemonset calico-node -n kube-system --type='json' -p='[{"op": "add", "path": "/spec/template/spec/tolerations/-", "value": {"operator": "Exists", "effect": "NoSchedule"}}]'
    fi

    if [ "$DEPLOYMENT_HAS_TOLERATION" -eq 0 ]; then
      microk8s kubectl patch deployment calico-kube-controllers -n kube-system --type='json' -p='[{"op": "add", "path": "/spec/template/spec/tolerations/-", "value": {"operator": "Exists", "effect": "NoSchedule"}}]'
    fi

    if [ "$DAEMONSET_HAS_NOEXECUTE_TOLERATION" -eq 0 ]; then
      microk8s kubectl patch daemonset calico-node -n kube-system --type='json' -p='[{"op": "add", "path": "/spec/template/spec/tolerations/-", "value": {"operator": "Exists", "effect": "NoExecute"}}]'
    fi

    if [ "$DEPLOYMENT_HAS_NOEXECUTE_TOLERATION" -eq 0 ]; then
      microk8s kubectl patch deployment calico-kube-controllers -n kube-system --type='json' -p='[{"op": "add", "path": "/spec/template/spec/tolerations/-", "value": {"operator": "Exists", "effect": "NoExecute"}}]'
    fi
