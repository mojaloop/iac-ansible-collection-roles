- name: Patch calico
  become: true
  ansible.builtin.shell: |
    microk8s kubectl patch FelixConfiguration/default --type merge -p '{"spec":{"xdpEnabled":false}}'
    microk8s kubectl patch FelixConfiguration/default --type='json' -p='[{"op": "add", "path": "/spec/workloadSourceSpoofing", "value": "Any"}]'
    
    # Check if tolerations with operator: Exists and effect: NoSchedule already exist
    DAEMONSET_HAS_TOLERATION=$(microk8s kubectl get daemonset calico-node -n kube-system -o json | jq '.spec.template.spec.tolerations[]? | select(.operator=="Exists" and .effect=="NoSchedule")' | wc -l)
    DEPLOYMENT_HAS_TOLERATION=$(microk8s kubectl get deployment calico-kube-controllers -n kube-system -o json | jq '.spec.template.spec.tolerations[]? | select(.operator=="Exists" and .effect=="NoSchedule")' | wc -l)
    
    # Check if tolerations with operator: Exists and effect: NoExecute already exist
    DAEMONSET_HAS_NOEXECUTE_TOLERATION=$(microk8s kubectl get daemonset calico-node -n kube-system -o json | jq '.spec.template.spec.tolerations[]? | select(.operator=="Exists" and .effect=="NoExecute")' | wc -l)
    DEPLOYMENT_HAS_NOEXECUTE_TOLERATION=$(microk8s kubectl get deployment calico-kube-controllers -n kube-system -o json | jq '.spec.template.spec.tolerations[]? | select(.operator=="Exists" and .effect=="NoExecute")' | wc -l)
    
    # Apply toleration to DaemonSet if not present
    if [ "$DAEMONSET_HAS_TOLERATION" -eq 0 ]; then
      microk8s kubectl patch daemonset calico-node -n kube-system --type='json' -p='[{"op": "add", "path": "/spec/template/spec/tolerations/-", "value": {"operator": "Exists", "effect": "NoSchedule"}}]'
    fi
    
    # Apply toleration to Deployment if not present  
    if [ "$DEPLOYMENT_HAS_TOLERATION" -eq 0 ]; then
      microk8s kubectl patch deployment calico-kube-controllers -n kube-system --type='json' -p='[{"op": "add", "path": "/spec/template/spec/tolerations/-", "value": {"operator": "Exists", "effect": "NoSchedule"}}]'
    fi
    
    # Apply NoExecute toleration to DaemonSet if not present
    if [ "$DAEMONSET_HAS_NOEXECUTE_TOLERATION" -eq 0 ]; then
      microk8s kubectl patch daemonset calico-node -n kube-system --type='json' -p='[{"op": "add", "path": "/spec/template/spec/tolerations/-", "value": {"operator": "Exists", "effect": "NoExecute"}}]'
    fi
    
    # Apply NoExecute toleration to Deployment if not present  
    if [ "$DEPLOYMENT_HAS_NOEXECUTE_TOLERATION" -eq 0 ]; then
      microk8s kubectl patch deployment calico-kube-controllers -n kube-system --type='json' -p='[{"op": "add", "path": "/spec/template/spec/tolerations/-", "value": {"operator": "Exists", "effect": "NoExecute"}}]'
    fi