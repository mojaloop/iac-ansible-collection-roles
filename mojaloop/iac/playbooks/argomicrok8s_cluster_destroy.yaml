- hosts: "{{ groups['bastion'] | sort | first }}"
  become: true
  roles:
    - role: mojaloop.iac.microk8s_workload_cleanup
      vars:
        teardown: true

- hosts: agent
  become: true
  vars:
    teardown: true
  roles:
    - role: mojaloop.iac.microk8s

- hosts: master
  become: true
  vars:
    teardown: true
  roles:
    - role: mojaloop.iac.microk8s